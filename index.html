  <style>
    * {
      box-sizing: border-box;
    }

    html {
      font-size: 95%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      background: #F5F5F0;
      color: #0f172a;
      -webkit-font-smoothing: antialiased;
      font-size: 15px;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      height: 100%;
    }

    #root {
      min-height: 100vh;
      height: 100%;
      width: 100%;
      background: #F5F5F0;
      position: relative;
    }

    .dark body {
      background-color: #323242;
      color: #ffffff;
    }

    .dark #root {
      background: #323242;
    }

    @media (max-width: 768px) {
      html { font-size: 100%; }
      body { font-size: 16px; }
    }

    /* Grainy Texture Utility */
    .bg-grain { position: relative; }
    .bg-grain::before {
      content: "";
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
      opacity: 0.05;
      background-image: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADIAAAAyBAMAAADsEZWCAAAAGFBMVEUAAAA5OTkAAAAAAAAAAABMTExERERmZmZnOtmWAAAACHRSTlMAMwAqzMzM/wO30gAAAAJcEhZcwAADsQAAA7EAZUrDhsAAAAwSURBVDjLY2AYBaNgKLHgAgNDgwMdwMAwqwUqhqJhqBqIaqCqgaggqgGqBqgGqBoADxwC+3R2Vz4AAAAASUVORK5CYII=");
      background-repeat: repeat;
    }

    /* Global Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 10px;
      border: 2px solid transparent;
      background-clip: content-box;
    }
    ::-webkit-scrollbar-thumb:hover { background-color: #94a3b8; }
    .dark ::-webkit-scrollbar-thumb { background-color: rgba(255, 255, 255, 0.3); }
    .dark ::-webkit-scrollbar-thumb:hover { background-color: rgba(255, 255, 255, 0.5); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Glass Panel */
    .glass-panel {
      background: #ffffff;
      border: 1px solid rgba(0, 0, 0, 0.04);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px -1px rgba(0, 0, 0, 0.02);
    }
    .dark .glass-panel {
      background: #23232e;
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.5);
    }
  </style>

  <link rel="stylesheet" href="/index.css">
