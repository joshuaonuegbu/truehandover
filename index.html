  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            // Base Colors
            cosmic: '#323242',
            obsidian: '#0f0f15',
            charcoal: '#23232e', // Updated card background color
            surface: '#2D2E45',
            editorial: '#F8FAFC', // Reverted to Cool Slate (was Beige)

            // Brand Colors - Restored Lime Green
            brand: {
              DEFAULT: '#bef264',
              hover: '#a3e635',
              glow: 'rgba(190, 242, 100, 0.5)'
            },
          },
          fontFamily: {
            sans: ['"Space Grotesk"', 'sans-serif'],
            serif: ['"Playfair Display"', 'Times New Roman', 'serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          animation: {
            'fade-in': 'fadeIn 0.6s ease-out',
            'slide-up': 'slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1)',
            'ticker': 'ticker 545s linear infinite',
            'blob': 'blob 7s infinite',
            'float': 'float 6s ease-in-out infinite',
            'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'sheet-up': 'sheetUp 0.4s cubic-bezier(0.16, 1, 0.3, 1)',
            'sheet-down': 'sheetDown 0.3s cubic-bezier(0.4, 0, 1, 1) forwards',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            slideUp: {
              '0%': { transform: 'translateY(20px)', opacity: '0' },
              '100%': { transform: 'translateY(0)', opacity: '1' },
            },
            ticker: {
              '0%': { transform: 'translateX(0)' },
              '100%': { transform: 'translateX(-50%)' },
            },
            blob: {
              '0%': { transform: 'translate(0px, 0px) scale(1)' },
              '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
              '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
              '100%': { transform: 'translate(0px, 0px) scale(1)' },
            },
            float: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-10px)' },
            },
            sheetUp: {
              '0%': { transform: 'translateY(100%)' },
              '100%': { transform: 'translateY(0)' },
            },
            sheetDown: {
              '0%': { transform: 'translateY(0)', opacity: '1' },
              '100%': { transform: 'translateY(100%)', opacity: '0' },
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Global UI Scaling - Simple and reliable approach using font-size only */
    * {
      box-sizing: border-box;
    }

    html {
      font-size: 95%;
      /* Slightly smaller base font for compact UI */
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      background: #F5F5F0;
      color: #0f172a;
      -webkit-font-smoothing: antialiased;
      font-size: 15px;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      height: 100%;
    }

    /* Ensure root fills entire viewport without gaps */
    #root {
      min-height: 100vh;
      height: 100%;
      width: 100%;
      background: #F5F5F0;
      position: relative;
    }

    /* Dark Mode */
    .dark body {
      background-color: #323242;
      color: #ffffff;
    }

    .dark #root {
      background: #323242;
    }

    /* Mobile: Reset to standard size for readability */
    @media (max-width: 768px) {
      html {
        font-size: 100%;
      }

      body {
        font-size: 16px;
      }
    }

    /* Grainy Texture Utility - Optimized Base64 PNG */
    .bg-grain {
      position: relative;
    }

    .bg-grain::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      opacity: 0.05;
      /* Lightweight 128x128 noise pattern instead of heavy SVG filter */
      background-image: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADIAAAAyBAMAAADsEZWCAAAAGFBMVEUAAAA5OTkAAAAAAAAAAABMTExERERmZmZnOtmWAAAACHRSTlMAMwAqzMzM/wO30gAAAAJcEhZcwAADsQAAA7EAZUrDhsAAAAwSURBVDjLY2AYBaNgKLHgAgNDgwMdwMAwqwUqhqJhqBqIaqCqgaggqgGqBqgGqBoADxwC+3R2Vz4AAAAASUVORK5CYII=");
      background-repeat: repeat;
    }

    /* --- GLOBAL CUSTOM SCROLLBAR --- */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      /* Light mode thumb */
      border-radius: 10px;
      border: 2px solid transparent;
      background-clip: content-box;
    }

    ::-webkit-scrollbar-thumb:hover {
      background-color: #94a3b8;
    }

    /* Dark Mode Scrollbar - HIGH VISIBILITY WHITE */
    .dark ::-webkit-scrollbar-thumb {
      background-color: rgba(255, 255, 255, 0.3);
      /* More visible white */
    }

    .dark ::-webkit-scrollbar-thumb:hover {
      background-color: rgba(255, 255, 255, 0.5);
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .glass-panel {
      background: #ffffff;
      border: 1px solid rgba(0, 0, 0, 0.04);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px -1px rgba(0, 0, 0, 0.02);
    }

    .dark .glass-panel {
      background: #23232e;
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.5);
    }
  </style>
